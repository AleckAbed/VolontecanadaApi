# Intégration continue de l'API : tests et audit des dépendances à chaque PR et sur master.
name: API

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, intl, openssl
          coverage: none
      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Préparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Tests
        run: php artisan test

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Failles connues
        run: composer audit
